name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.13.0"

jobs:
  # Core library tests (Linux)
  core-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libjack-jackd2-dev \
            libfftw3-dev libsamplerate0-dev

      - name: Build core (miniaudio)
        working-directory: CyberHex-clone/core
        run: zig build -Ddecoder=miniaudio

      - name: Run unit tests
        working-directory: CyberHex-clone/core
        run: zig build test

      - name: Run smoke test (headless)
        working-directory: CyberHex-clone/core
        run: |
          # Create a dummy audio device for testing
          export SDL_AUDIODRIVER=dummy
          zig build smoke 2>&1 || true  # May fail in CI without audio

  # Core library tests with FFmpeg
  core-tests-linux-ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev libfftw3-dev libsamplerate0-dev

      - name: Build core (ffmpeg)
        working-directory: CyberHex-clone/core
        run: zig build -Ddecoder=ffmpeg

      - name: Run unit tests
        working-directory: CyberHex-clone/core
        run: zig build test

  # Linux Flutter bundle
  flutter-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libglib2.0-dev libblkid-dev

      - name: Build Flutter Linux bundle
        working-directory: CyberHex-clone
        run: |
          cd linux
          flutter pub get
          zig build -Drelease=true -Ddecoder=miniaudio

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: cyberhex-linux
          path: CyberHex-clone/zig-out/
          retention-days: 7

  # Windows cross-compile
  windows-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build core for Windows
        working-directory: CyberHex-clone/core
        run: zig build -Dtarget=x86_64-windows-gnu -Ddecoder=miniaudio

      - name: Upload Windows core
        uses: actions/upload-artifact@v4
        with:
          name: cyberhex-windows-core
          path: CyberHex-clone/core/zig-out/
          retention-days: 7

  # macOS cross-compile (if runner available)
  macos-cross:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build core for macOS
        working-directory: CyberHex-clone/core
        run: zig build -Dtarget=x86_64-macos -Ddecoder=miniaudio

      - name: Build core for macOS ARM64
        working-directory: CyberHex-clone/core
        run: zig build -Dtarget=aarch64-macos -Ddecoder=miniaudio

      - name: Upload macOS cores
        uses: actions/upload-artifact@v4
        with:
          name: cyberhex-macos-core
          path: CyberHex-clone/core/zig-out/
          retention-days: 7

  # Android build
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r27

      - name: Build core for Android (all ABIs)
        working-directory: CyberHex-clone/core
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            case $abi in
              arm64-v8a) zig_target="aarch64-linux-android" ;;
              armeabi-v7a) zig_target="arm-linux-android" ;;
              x86_64) zig_target="x86_64-linux-android" ;;
              x86) zig_target="x86-linux-android" ;;
            esac
            zig build -Dtarget=$zig_target -Ddecoder=miniaudio --prefix zig-out-android-$abi
          done

      - name: Upload Android cores
        uses: actions/upload-artifact@v4
        with:
          name: cyberhex-android
          path: CyberHex-clone/core/zig-out-android-*/
          retention-days: 7

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check Zig formatting
        run: |
          zig fmt --check CyberHex-clone/core/build.zig CyberHex-clone/core/src/*.c CyberHex-clone/core/src/*.h CyberHex-clone/core/include/*.h

      - name: Run Clang static analysis
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tools
          cd CyberHex-clone/core
          scan-build -o /tmp/scan zig build -Ddecoder=miniaudio 2>&1 | head -100

  # Release build (triggered on tags)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [flutter-linux, windows-cross, macos-cross, android-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            CyberHex-clone/zig-out/cyberhex
            CyberHex-clone/zig-out/lib/*
          generate_release_notes: true