# Integración continua de CyberHex.
#
# Tres trabajos, de más barato a más caro:
#
#   core      compila el núcleo con Zig 0.17.1 sin FFmpeg y pasa sus tests y la
#             prueba de humo (sirve en un runner sin tarjeta de sonido: el
#             motor cae a un dispositivo nulo y aun así mide niveles).
#   static    valida lo que no necesita SDK: XML del manifiesto, sintaxis de los
#             scripts de empaquetado y que este propio YAML sea válido.
#   app       `flutter pub get`, `flutter analyze` (solo falla con errores) y
#             `flutter test`. Es el único sitio donde la capa Dart se ejecuta de
#             verdad: en el sandbox del agente no hay SDK.
#
# No se despliega nada: son comprobaciones, no publicaciones.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  # `contents: write` solo lo usa el paso de diagnóstico, que publica el
  # registro del fallo como comentario del commit (ver la nota de ese paso).
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Núcleo (Zig 0.17.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: ALSA de mentira (los runners no tienen tarjeta de sonido)
        # Sin tarjeta, miniaudio no consigue abrir el dispositivo y
        # `ch_engine_create` devuelve nulo (varios tests fallan con SinMotor).
        # El plugin `null` de ALSA deja que el motor arranque igual.
        run: |
          set -euo pipefail
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$RUNNER_TEMP/asound.conf"
          echo "ALSA_CONFIG_PATH=$RUNNER_TEMP/asound.conf" >> "$GITHUB_ENV"

      - name: Tests del núcleo (miniaudio)
        # El registro se guarda y se reemite como anotaciones del check: así se
        # puede leer el fallo desde la API sin descargar el log del job.
        run: |
          set +e
          zig build test -Ddecoder=miniaudio > core-test.log 2>&1
          code=$?
          tail -80 core-test.log
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "${line//::/:}"
            done < <(grep -E 'error|failed|panic|expected' core-test.log | head -30)
          fi
          exit $code

      - name: Prueba de humo con audio real
        # El WAV sintético se escribe en el temporal del runner, no en el repo.
        if: always()
        continue-on-error: true
        run: |
          set +e
          zig build smoke -Ddecoder=miniaudio -Dsmoke-dir="$RUNNER_TEMP" > core-smoke.log 2>&1
          code=$?
          tail -40 core-smoke.log
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              printf '::warning::%s\n' "${line//::/:}"
            done < <(grep -E 'error|failed|panic|dispositivo|device' core-smoke.log | head -20)
          fi
          exit $code

      - name: La biblioteca dinámica se produce
        # `zig build test` no instala artefactos: hay que pedir el install.
        run: |
          set -euo pipefail
          zig build -Ddecoder=miniaudio
          test -f zig-out/lib/libcyberhex_core.so
          nm -D zig-out/lib/libcyberhex_core.so | grep -q ' T ch_'

  static:
    name: Estático (manifiesto, scripts, YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: XML del manifiesto de Android
        run: >
          python3 -c "import xml.etree.ElementTree as ET;
          ns = '{http://schemas.android.com/apk/res/android}';
          tree = ET.parse('android/app/src/main/AndroidManifest.xml');
          names = [node.get(ns + 'name') for node in tree.iter('uses-permission')];
          assert 'android.permission.BLUETOOTH_CONNECT' in names, names;
          assert 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' in names, names;
          print('permisos:', len(names), 'ok')"

      - name: Sintaxis de los scripts de empaquetado
        run: |
          set -euo pipefail
          bash -n packaging/macos/build_macos.sh
          echo 'macOS: ok'
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $tokens = $null; $errors = $null;
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                "packaging/windows/build_windows.ps1", [ref]$tokens, [ref]$errors);
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Host $_ };
                exit 1
              }
              Write-Host "Windows: ok"'
          else
            echo 'pwsh no esta: me salto el .ps1'
          fi

      - name: El flujo de trabajo es YAML válido
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
          python3 -c "import yaml; d = yaml.safe_load(open('.github/workflows/ci.yml', encoding='utf-8')); assert set(d['jobs']) == {'core', 'static', 'app'}, list(d['jobs']); print('jobs:', ', '.join(d['jobs']))"

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones
        run: |
          flutter --version
          dart --version

      - name: Dependencias
        run: flutter pub get

      - name: Analizador
        id: analizador
        # Los avisos y las notas no rompen el build (hay deuda de estilo
        # acumulada); los errores sí. Se deja seguir para que los tests se
        # ejecuten igualmente y cada error quede como anotación del check.
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          tail -60 analyze.log
          if [ $code -ne 0 ]; then
            # Formato: "error • mensaje • lib/x.dart:12:5 • code"
            awk -F ' • ' '/^ *error/ && NF >= 4 {
              split($3, loc, ":");
              printf "::error file=%s,line=%s,col=%s::%s (%s)\n", loc[1], loc[2], loc[3], $2, $4
            }' analyze.log | head -50
          fi
          exit $code

      - name: Tests de la app
        id: tests
        continue-on-error: true
        run: |
          set +e
          flutter test --reporter expanded > tests.log 2>&1
          code=$?
          tail -80 tests.log
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "${line//::/:}"
            done < <(grep -E '\[E\]|overflowed|Exception|Expected:|Actual:' tests.log | head -24)
            # El desbordamiento explica qué widget se queda sin sitio: el
            # nombre sale en las líneas siguientes al aviso.
            while IFS= read -r line; do
              printf '::warning::%s\n' "${line//::/:}"
            done < <(grep -A30 'overflowed by' tests.log |
              grep -E 'overflowed|error-causing|player_page|library_page|queue_sheet|Row|Column|padding|constraints' | head -30)
          fi
          exit $code

      - name: Diagnóstico del fallo
        # Temporal: cuando algo falla, el registro del job no se puede descargar
        # desde según qué entornos (el redirect vive en otro host), así que las
        # últimas 120 líneas de `tests.log` y `analyze.log` se publican como
        # comentario del commit, que sí se lee por la API.
        if: failure() || steps.tests.outcome == 'failure' || steps.analizador.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f analyze.log ]; then
            printf '### analyze.log (avisos)\n\n' >> diagnostico.txt
            tail -40 analyze.log >> diagnostico.txt
            printf '\n\n' >> diagnostico.txt
          fi
          if [ -f tests.log ]; then
            printf '### tests.log: fallos\n\n' >> diagnostico.txt
            # Tres vistas del registro: cada excepción con su widget, los
            # "Test failed" sueltos y la lista de tests en rojo.
            {
              grep -A26 'EXCEPTION CAUGHT BY' tests.log
              grep -B4 -A4 'Test failed\. See exception logs' tests.log
              # Toques que no llegan al widget: explican los "no encuentro el texto".
              grep -A3 'would not hit test\|Warning: A call to' tests.log
              grep -E '\[E\]' tests.log
              # En los `test()` sin widgets el mensaje va detrás de la línea [E].
              grep -A6 '\[E\]$' tests.log
            } | head -800 >> diagnostico.txt
            printf '\n### cola del registro\n\n' >> diagnostico.txt
            tail -40 tests.log >> diagnostico.txt
            printf '\n\n' >> diagnostico.txt
          fi
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@diagnostico.txt >/dev/null 2>&1 || echo 'aviso: no pude publicar el diagnostico'

      - name: Resumen
        if: always()
        run: |
          echo "analizador: ${{ steps.analizador.outcome }}"
          echo "tests:      ${{ steps.tests.outcome }}"
          test "${{ steps.analizador.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
