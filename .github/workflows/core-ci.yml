name: Core CI

on:
  push:
    paths:
      - 'CyberHex-clone/core/**'
  pull_request:
    paths:
      - 'CyberHex-clone/core/**'

env:
  ZIG_VERSION: "0.13.0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        decoder: [miniaudio, ffmpeg]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies (ffmpeg)
        if: matrix.decoder == 'ffmpeg'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      - name: Install dependencies (common)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libjack-jackd2-dev

      - name: Build core
        working-directory: CyberHex-clone/core
        run: zig build -Ddecoder=${{ matrix.decoder }}

      - name: Run unit tests
        working-directory: CyberHex-clone/core
        run: zig build test

      - name: Run smoke test
        working-directory: CyberHex-clone/core
        run: |
          export SDL_AUDIODRIVER=dummy
          zig build smoke 2>&1 || true

  test-cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-windows-gnu
          - aarch64-linux-android
          - arm-linux-android
          - x86_64-linux-android
          - x86-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build for ${{ matrix.target }}
        working-directory: CyberHex-clone/core
        run: zig build -Dtarget=${{ matrix.target }} -Ddecoder=miniaudio
        continue-on-error: true